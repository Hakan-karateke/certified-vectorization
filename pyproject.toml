[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekilden-denkleme"
version = "3.0.0"
description = "Siyah-beyaz görsellerin sınırlarını matematiksel denklemlere dönüştürür."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hakan Karateke" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "scipy>=1.12,<2", "matplotlib>=3.7,<4", "shapely>=2.0,<3", "reportlab>=4,<6", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4,<5"]
cad = ["ezdxf>=1.4.4,<2", "cadquery-ocp-novtk>=7.9.3.1.1,<8"]

[project.scripts]
sekilden-denkleme = "sekilden_denkleme.cli:main"
sekilden-denkleme-gui = "sekilden_denkleme.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
